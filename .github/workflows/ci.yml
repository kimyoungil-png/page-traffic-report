name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Check shell scripts
        run: |
          sh -n deploy_cloud_run.sh
          bash -n configure_gemini_secret.sh
          bash -n configure_gsc_user_oauth.sh
          bash -n bootstrap_and_deploy.sh
          bash -n deploy_browser_helper.sh
          bash -n finish_setup.sh
          bash -n secure_cloud_run_iap.sh
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q
